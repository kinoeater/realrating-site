<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RealRating — bald wieder da</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0F1B2D; --navy2: #162438; --amber: #F5A623;
    --white: #F8F8F6; --muted: #8A98A8; --border: #1E2F45;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--navy);
    color: var(--white);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .logo {
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.03em;
    margin-bottom: 40px;
  }
  .logo span { color: var(--amber); }
  .dots { display: flex; gap: 8px; margin-bottom: 28px; }
  .dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber); opacity: 0.35;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  h1 {
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 900;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
    max-width: 560px;
  }
  p.sub {
    color: var(--muted);
    font-size: 15px;
    max-width: 420px;
    line-height: 1.6;
  }
  .lang-switch {
    display: flex;
    gap: 6px;
    margin-top: 36px;
  }
  .lang-switch button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .lang-switch button.active,
  .lang-switch button:hover {
    border-color: var(--amber);
    color: var(--amber);
  }
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 24px;
    text-align: center;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
  }
  footer a:hover { color: var(--white); }
</style>
</head>
<body>

<main>
  <div class="logo">Real<span>Rating</span></div>
  <div class="dots"><i></i><i></i><i></i></div>
  <h1 data-i18n="headline">Wir bauen gerade um.</h1>
  <p class="sub" data-i18n="sub">RealRating wird gerade überarbeitet. Schauen Sie bald wieder vorbei.</p>

  <div class="lang-switch">
    <button type="button" data-lang="de" class="active">DE</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="tr">TR</button>
  </div>
</main>

<footer>
  <a href="privacy.html">Impressum</a>
</footer>

<script>
  var T = {
    de: {
      headline: "Wir bauen gerade um.",
      sub: "RealRating wird gerade überarbeitet. Schauen Sie bald wieder vorbei."
    },
    en: {
      headline: "We're rebuilding.",
      sub: "RealRating is currently being reworked. Check back soon."
    },
    tr: {
      headline: "Yeniden düzenliyoruz.",
      sub: "RealRating şu anda güncelleniyor. Yakında tekrar uğrayın."
    }
  };

  var buttons = document.querySelectorAll(".lang-switch button");
  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var lang = btn.getAttribute("data-lang");
      buttons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelector('[data-i18n="headline"]').textContent = T[lang].headline;
      document.querySelector('[data-i18n="sub"]').textContent = T[lang].sub;
      document.documentElement.lang = lang;
    });
  });
</script>

</body>
</html>
